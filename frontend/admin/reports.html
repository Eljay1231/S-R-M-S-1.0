<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | Student Records</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/tables.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="main-nav" aria-label="Main navigation">
      <p class="brand"><a href="dashboard.html">Student Records</a></p>
      <nav>
        <ul class="nav-list">
          <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li><a class="nav-link" href="students.html">Students</a></li>
          <li><a class="nav-link" href="student-form.html">Add Student</a></li>
          <li><a class="nav-link" href="courses.html">Courses</a></li>
          <li><a class="nav-link" href="reports.html" aria-current="page">Reports</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button class="button button-secondary" type="button" data-logout>Log out</button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="button button-secondary menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
        <h1>Reports</h1>
        <span class="topbar-user">Administrator</span>
      </header>
      <main class="main-content">
        <div class="page-heading">
          <div>
            <h2>Student reports</h2>
            <p>Filter student records and print a report.</p>
          </div>
          <button id="print-report" class="button button-secondary no-print" type="button">Print report</button>
        </div>
        <section class="panel">
          <div class="filter-bar no-print">
            <div class="field">
              <label for="report-type">Report</label>
              <select id="report-type">
                <option value="all-students">Complete student list</option>
                <option value="by-course">Students by course</option>
                <option value="by-year">Students by year level</option>
                <option value="enrollment">Course enrollment summary</option>
              </select>
            </div>
            <div class="field">
              <label for="report-search">Search students</label>
              <input id="report-search" type="search">
            </div>
            <div class="field">
              <label for="report-course">Course filter</label>
              <select id="report-course">
                <option value="">All courses</option>
              </select>
            </div>
            <div class="field">
              <label for="report-year">Year level filter</label>
              <select id="report-year">
                <option value="">All years</option>
                <option value="1">Year 1</option>
                <option value="2">Year 2</option>
                <option value="3">Year 3</option>
                <option value="4">Year 4</option>
              </select>
            </div>
            <button id="clear-report-filters" class="button button-secondary" type="button">Clear filters</button>
          </div>
          <div class="panel-body">
            <div id="report-heading" class="print-meta"></div>
            <div class="panel-header">
              <h3 id="report-title">Complete student list</h3>
              <p id="report-total" class="result-count" aria-live="polite"></p>
            </div>
            <div id="report-content"></div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/reports.js"></script>
</body>
</html>
